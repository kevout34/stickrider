<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Portal Drop – MTB Run Builder</title>
  <meta name="theme-color" content="#0f131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Drop">
  <style>
:root {
  --bg: #0f131b;
  --panel: #171d29;
  --panel2: #1f2735;
  --line: #2b3546;
  --text: #e9eef7;
  --muted: #93a0b5;
  --accent: #36d97a;
  --accent-ink: #062b14;
  --sel: #ffcc33;
  --bad: #ff4d4d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

#app {
  height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* top bar */
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; letter-spacing: 0.2px; white-space: nowrap; }
.logo { color: #b678ff; text-shadow: 0 0 10px #8a4dff; }
#hint { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.pill { font-size: 12px; color: var(--muted); background: var(--panel2); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.primary { white-space: nowrap; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 18px; font-weight: 800; }
.primary:active { transform: translateY(1px); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--text); }
body.riding #rideBtn { background: #ff6b4a; color: #2b0a02; }

/* stage */
#stage { position: relative; min-height: 0; overflow: hidden; }
#game { display: block; touch-action: none; cursor: pointer; }
#game.dragging { cursor: grabbing; }

#overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,10,16,0.45);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
#overlay.hidden { display: none; }
.card .row { flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px;
  max-width: min(420px, 90%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
.card h2 { margin: 0 0 6px; font-size: 22px; }
#overlay.win .card h2 { color: #c99bff; }
.card p { margin: 0 0 16px; color: var(--muted); line-height: 1.4; }
.card .row { display: flex; gap: 10px; justify-content: center; }

#toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0;
  background: rgba(20,24,34,0.95); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
  font-size: 14px; pointer-events: none; transition: 0.2s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* editor */
#editor { background: var(--panel); border-top: 1px solid var(--line); display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 420px); gap: 10px; padding: 10px 12px; transition: opacity 0.2s; }
body.riding #editor { opacity: 0.45; pointer-events: none; }
.strip-wrap { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; column-gap: 6px;
  align-items: center; text-align: left; background: var(--panel2); border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; }
.chip .num { grid-row: 1 / 3; font-size: 11px; color: var(--muted); }
.chip .ic { grid-row: 1 / 3; color: #6b4a2e; display: flex; }
.chip .nm { font-weight: 700; font-size: 13px; }
.chip .sub { font-size: 11px; color: var(--muted); grid-column: 3; }
.chip.sel { border-color: var(--sel); }
.chip.bad { border-color: var(--bad); background: #3a1d22; }
#addRow { display: flex; gap: 6px; flex-wrap: wrap; }
#addRow button { background: transparent; border: 1px dashed #4a5a75; border-radius: 10px; padding: 7px 12px; font-weight: 600; color: #cdd7e8; }
#addRow button:active { background: var(--panel2); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }

#props { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prop-head { display: flex; align-items: center; justify-content: space-between; }
.prop-head .acts { display: flex; gap: 4px; }
.prop-head .acts button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 30px; padding: 0; }
.prop-head .acts .danger { color: #ff8a7a; }
.prop label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.prop .val { color: var(--text); font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 6px; }
.step { width: 30px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); padding: 0; font-weight: 700; flex: 0 0 auto; }
.tip { font-size: 12px; color: var(--muted); }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #334058; border-radius: 3px; }
input[type=range]::-moz-range-track { height: 6px; background: #334058; border-radius: 3px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--sel); border: 2px solid #3d2f00; }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--sel); border: 2px solid #3d2f00; }

/* narrow portrait */
@media (max-width: 720px) {
  #hint { display: none; }
  #editor { grid-template-columns: 1fr; }
  .brand { font-size: 15px; }
}
/* phone landscape: editor becomes a sidebar */
@media (orientation: landscape) and (max-height: 520px) {
  #app { grid-template-columns: 1fr 270px; grid-template-rows: auto 1fr; }
  #hint { display: none; }
  #editor { grid-row: 2; grid-column: 2; grid-template-columns: 1fr; border-top: 0; border-left: 1px solid var(--line);
    overflow-y: auto; align-content: start; }
  #strip { flex-wrap: wrap; overflow: visible; }
}

/* level navigation */
.lvlnav { position: relative; display: flex; align-items: center; gap: 4px; }
.navbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 34px; padding: 0; font-size: 20px; line-height: 1; }
.navbtn:disabled { opacity: 0.35; }
.navbtn.locked { opacity: 0.5; }
#lvlName { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 12px; font-weight: 700; white-space: nowrap; }
.lvnum { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: #b678ff; color: #1b0838; font-size: 12px; font-weight: 800; margin-right: 4px; }
.stars { color: var(--sel); letter-spacing: 1px; font-size: 13px; margin-left: 4px; }
#lvlMenu { position: absolute; top: 40px; left: 36px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 240px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 2px; }
#lvlMenu.hidden { display: none; }
.lvitem { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; text-align: left; }
.lvitem:hover:not(:disabled), .lvitem.cur { background: var(--panel2); }
.lvitem:disabled { opacity: 0.45; cursor: default; }
.lvitem .lvn { flex: 1; font-weight: 600; }
.hidden { display: none !important; }
@media (max-width: 720px) {
  .brand { display: none; }
  #topbar { flex-wrap: wrap; row-gap: 6px; }
  .lvlnav { flex: 1 1 100%; }
  #lvlName { flex: 1; padding: 0 8px; font-size: 14px; text-align: left; }
  #lvlMenu { left: 0; right: 0; }
}

/* piece icons */
.pico { width: 34px; height: 24px; display: block; }
.chip .ic { background: #e9d9c4; border-radius: 7px; padding: 2px 3px; }
.chip.sel .ic { background: #ffe7a3; }
#addRow button { display: flex; align-items: center; gap: 6px; color: #e2c9a6; }
#addRow button span { color: #cdd7e8; }
#addRow .pico { width: 30px; height: 21px; }
.hic { display: inline-flex; vertical-align: middle; margin-right: 6px; color: #e2c9a6; }
.hic .pico { width: 30px; height: 21px; }

</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">◉</span> Portal Drop</div>
      <div class="lvlnav">
        <button id="prevLvl" class="navbtn" aria-label="Previous level">‹</button>
        <button id="lvlName"></button>
        <button id="nextLvl" class="navbtn" aria-label="Next level">›</button>
        <div id="lvlMenu" class="hidden"></div>
      </div>
      <div id="hint"></div>
      <div class="spacer"></div>
      <span id="pieceCount" class="pill"></span>
      <button id="clearBtn" class="ghost">Clear</button>
      <button id="rideBtn" class="primary">▶ Ride</button>
    </header>

    <main id="stage">
      <canvas id="game" aria-label="Game canvas"></canvas>
      <div id="overlay" class="hidden">
        <div class="card">
          <h2 id="ovTitle"></h2>
          <p id="ovMsg"></p>
          <div class="row">
            <button id="ovEdit" class="ghost">✎ Edit run</button>
            <button id="ovRetry" class="primary">↻ Ride again</button>
            <button id="ovNext" class="primary hidden">Next level →</button>
          </div>
        </div>
      </div>
      <div id="toast"></div>
    </main>

    <section id="editor">
      <div class="strip-wrap">
        <div id="strip"></div>
        <div id="addRow">
          <button data-add="ramp">+ Ramp</button>
          <button data-add="curve">+ Curve</button>
          <button data-add="gap">+ Gap</button>
        </div>
      </div>
      <div id="props"></div>
    </section>
  </div>

  <script>
// Level definitions. World is 1600 x 900 units, y grows downward.
// ground:    fixed dirt surfaces (polylines, listed left -> right)
// hazards:   rectangles that crash the rider on contact (type: 'spikes' | 'wall')
// noBuild:   rectangles your track may not pass through (forces jumps)
// portal:    the finish line. ground:true = must be rolling on the ground (no flying in)
// par:       piece count for 3 stars
// draggable: portal can be moved by the player (Free Ride)
(function (G) {
  const MTB = (G.MTB = G.MTB || {});
  MTB.WORLD = { W: 1600, H: 900 };

  const START = [{ type: 'ramp', angle: 30, length: 220 }];

  MTB.LEVELS = [
    {
      id: 'drop-in',
      name: 'Drop In',
      hint: 'Shape a smooth run down to the portal on the valley floor. Roll in on your wheels.',
      portal: { x: 1350, y: 775, r: 60, ground: true },
      ground: [[[0, 830], [1600, 830]]],
      hazards: [],
      noBuild: [],
      par: 2,
      start: START,
    },
    {
      id: 'sky-portal',
      name: 'Sky Portal',
      hint: 'This portal floats in mid-air. Finish with an up-curve to launch into it.',
      portal: { x: 1250, y: 380, r: 50 },
      ground: [[[0, 870], [1600, 870]]],
      hazards: [],
      noBuild: [{ x: 1000, y: 0, w: 600, h: 900 }],
      par: 2,
      start: START,
    },
    {
      id: 'mind-the-gap',
      name: 'Mind the Gap',
      hint: 'Build a kicker, clear the spike canyon and land on the far slope.',
      portal: { x: 1450, y: 650, r: 60, ground: true },
      ground: [[[1000, 560], [1250, 690], [1600, 700]]],
      hazards: [{ type: 'spikes', x: 640, y: 860, w: 360, h: 40 }],
      noBuild: [{ x: 640, y: 0, w: 360, h: 900 }],
      par: 2,
      start: START,
    },
    {
      id: 'thread-the-needle',
      name: 'Thread the Needle',
      hint: 'Fly through the window in the cliff to reach the portal beyond.',
      portal: { x: 1380, y: 470, r: 45 },
      ground: [[[0, 880], [1600, 880]]],
      hazards: [
        { type: 'wall', x: 1000, y: 0, w: 44, h: 390 },
        { type: 'wall', x: 1000, y: 540, w: 44, h: 340 },
      ],
      noBuild: [{ x: 960, y: 0, w: 640, h: 900 }],
      par: 2,
      start: START,
    },
    {
      id: 'over-the-wall',
      name: 'Over the Wall',
      hint: 'Clear the rock wall, then add a Gap piece to place your own landing ramp.',
      portal: { x: 1400, y: 780, r: 50, ground: true },
      ground: [[[0, 840], [1600, 840]]],
      hazards: [{ type: 'wall', x: 900, y: 430, w: 50, h: 410 }],
      noBuild: [{ x: 860, y: 0, w: 130, h: 900 }],
      par: 4,
      start: START,
    },
    {
      id: 'sandbox',
      name: 'Free Ride',
      hint: 'No rules. Build anything and drag the portal wherever you want.',
      portal: { x: 1300, y: 640, r: 55 },
      ground: [[[0, 860], [1600, 860]]],
      hazards: [],
      noBuild: [],
      draggable: true,
      start: [
        { type: 'ramp', angle: 35, length: 380 },
        { type: 'curve', turn: 60, radius: 220 },
      ],
    },
  ];
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
// Turns a list of track pieces into drawable / collidable polylines.
// Heading convention: degrees, 0 = flat to the right, positive = pointing downhill.
(function (G) {
  const MTB = (G.MTB = G.MTB || {});
  const rad = (d) => (d * Math.PI) / 180;

  function makeSegments(lines) {
    const segs = [];
    for (const L of lines) {
      for (let k = 1; k < L.length; k++) {
        const a = L[k - 1], b = L[k];
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
        if (len < 0.01) continue;
        const tx = dx / len, ty = dy / len;
        segs.push({
          ax: a.x, ay: a.y, bx: b.x, by: b.y, tx, ty, nx: ty, ny: -tx, len,
          p: b.p === undefined ? -1 : b.p,
          minx: Math.min(a.x, b.x), maxx: Math.max(a.x, b.x),
          miny: Math.min(a.y, b.y), maxy: Math.max(a.y, b.y),
        });
      }
    }
    return segs;
  }

  const Track = {
    DECK: { x1: 14, x2: 120, y: 150 },
    BLEND_R: 90, // radius used to smooth the joint into a ramp

    TYPES: {
      ramp: {
        label: 'Ramp', icon: '⟋',
        make: () => ({ type: 'ramp', angle: 30, length: 200 }),
        params: [
          { k: 'angle', label: 'Grade', min: -60, max: 80, step: 1 },
          { k: 'length', label: 'Length', min: 20, max: 800, step: 5 },
        ],
      },
      curve: {
        label: 'Curve', icon: '◡',
        make: () => ({ type: 'curve', turn: 40, radius: 180 }),
        params: [
          { k: 'turn', label: 'Bend', min: -150, max: 360, step: 1 },
          { k: 'radius', label: 'Radius', min: 30, max: 600, step: 5 },
        ],
      },
      gap: {
        label: 'Gap', icon: '⇢',
        make: () => ({ type: 'gap', width: 180, drop: 60, landAngle: 30 }),
        params: [
          { k: 'width', label: 'Gap width', min: 20, max: 700, step: 5 },
          { k: 'drop', label: 'Landing drop', min: -300, max: 600, step: 5 },
          { k: 'landAngle', label: 'Landing grade', min: -40, max: 80, step: 1 },
        ],
      },
    },

    build(pieces) {
      const D = this.DECK;
      const lines = [];
      let cur = [{ x: D.x1, y: D.y, p: -1 }, { x: D.x2, y: D.y, p: -1 }];
      lines.push(cur);
      let x = D.x2, y = D.y, h = 0;
      const ends = [];
      const push = (i) => cur.push({ x, y, p: i });

      const turnTo = (target, R, i) => {
        const diff = target - h;
        if (Math.abs(diff) < 0.01) { h = target; return; }
        const n = Math.max(2, Math.ceil(Math.abs(diff) / 3));
        const dh = diff / n;
        const ds = R * Math.abs(rad(dh));
        for (let k = 0; k < n; k++) {
          const hm = rad(h + dh / 2);
          x += Math.cos(hm) * ds;
          y += Math.sin(hm) * ds;
          h += dh;
          push(i);
        }
        h = target;
      };

      pieces.forEach((pc, i) => {
        if (pc.type === 'ramp') {
          turnTo(pc.angle, this.BLEND_R, i);
          x += Math.cos(rad(h)) * pc.length;
          y += Math.sin(rad(h)) * pc.length;
          push(i);
        } else if (pc.type === 'curve') {
          turnTo(h - pc.turn, pc.radius, i);
        } else if (pc.type === 'gap') {
          x += pc.width;
          y += pc.drop;
          h = pc.landAngle;
          cur = [{ x, y, p: i }];
          lines.push(cur);
        }
        ends.push({ x, y, h });
      });

      return { lines, segments: makeSegments(lines), ends, pen: { x, y, h } };
    },

    groundSegments(level) {
      const lines = level.ground.map((pl) => pl.map(([x, y]) => ({ x, y, p: -2 })));
      return makeSegments(lines);
    },

    // Returns a Set of piece indices that cross blocked areas or leave the world.
    validate(built, level) {
      const { W, H } = MTB.WORLD;
      const bad = new Set();
      const blocks = level.noBuild.concat(
        level.hazards.map((h) => ({ x: h.x - 8, y: h.y - 8, w: h.w + 16, h: h.h + 16 }))
      );
      const blocked = (x, y) => {
        if (x < 0 || x > W || y < 0 || y > H) return true;
        for (const b of blocks) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return true;
        return false;
      };
      for (const s of built.segments) {
        if (s.p < 0 || bad.has(s.p)) continue;
        const n = Math.max(1, Math.ceil(s.len / 8));
        for (let k = 0; k <= n; k++) {
          const t = k / n;
          if (blocked(s.ax + (s.bx - s.ax) * t, s.ay + (s.by - s.ay) * t)) { bad.add(s.p); break; }
        }
      }
      return bad;
    },

    describe(pc) {
      if (pc.type === 'ramp') {
        const a = pc.angle;
        return a === 0 ? 'flat' : `${Math.abs(a)}° ${a > 0 ? 'down' : 'up'}`;
      }
      if (pc.type === 'curve') {
        return pc.turn >= 0 ? `${pc.turn}° up` : `${-pc.turn}° over`;
      }
      return `${pc.width} wide`;
    },
  };

  MTB.Track = Track;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
// Rider physics: a point mass (wheel-radius circle) rolling on one-sided line segments.
(function (G) {
  const MTB = (G.MTB = G.MTB || {});

  const TAU = Math.PI * 2;
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  const lerpAng = (a, b, t) => a + angDiff(a, b) * t;

  const Physics = {
    G: 600,            // gravity (units/s^2)
    R: 9,              // wheel radius
    SUB: 1 / 480,      // fixed sub-step
    CRASH_IMPACT: 430, // max normal speed absorbed on landing
    CRASH_ANGLE: 65,   // max bike-vs-ground mismatch on landing (deg)
    ROLL: 12,          // rolling resistance
    DRAG: 0.00008,     // air drag
    TIME_LIMIT: 45,
    PEDAL_TIME: 1,     // seconds of pedalling before the rider coasts
    angDiff, lerpAng,

    createRider() {
      const D = MTB.Track.DECK;
      return {
        x: D.x1 + 40, y: D.y - this.R, vx: 150, vy: 0,
        ang: 0, wheel: 0, crank: 0,
        grounded: true, air: 0, stall: 0, t: 0, tick: 0,
        state: 'riding', msg: '', trail: [], maxSpeed: 0,
      };
    },

    collide(o, segs, R) {
      let hit = false, impact = 0, best = null, bestPen = -1;
      for (const s of segs) {
        if (o.x < s.minx - R || o.x > s.maxx + R || o.y < s.miny - R || o.y > s.maxy + R) continue;
        const px = o.x - s.ax, py = o.y - s.ay;
        const side = px * s.nx + py * s.ny;
        if (side < -R * 0.6) continue; // underneath: one-sided surfaces
        const traw = px * s.tx + py * s.ty;
        let ux, uy, d;
        if (side <= 0) {
          if (traw < 0 || traw > s.len) continue;
          ux = s.nx; uy = s.ny; d = side;
        } else {
          const t = traw < 0 ? 0 : traw > s.len ? s.len : traw;
          const dx = o.x - (s.ax + s.tx * t), dy = o.y - (s.ay + s.ty * t);
          const d2 = dx * dx + dy * dy;
          if (d2 >= R * R) continue;
          d = Math.sqrt(d2);
          if (d < 1e-6) { ux = s.nx; uy = s.ny; } else { ux = dx / d; uy = dy / d; }
        }
        const pen = R - d;
        o.x += ux * pen; o.y += uy * pen;
        const vn = o.vx * ux + o.vy * uy;
        if (vn < 0) { impact = Math.max(impact, -vn); o.vx -= vn * ux; o.vy -= vn * uy; }
        hit = true;
        if (pen > bestPen) { bestPen = pen; best = s; }
      }
      return { hit, impact, seg: best };

      ground(ctx, level);
      track(ctx, S.built, { selected: S.sel, invalid: S.invalid, editing: S.mode === 'edit' });
      portal(ctx, level.portal, S.t, { editing: S.mode === 'edit', draggable: !!level.draggable, flash: S.rider && S.rider.state === 'finished' ? Math.max(0, 1 - S.endT) : 0 });
      if (S.mode === 'edit') {
        trail(ctx, S.lastTrail);
        if (S.lastEnd && S.lastEnd.state === 'crashed') crashMark(ctx, S.lastEnd);
        rider(ctx, MTB.Physics.createRider(), {});
      } else if (S.rider) {
        rider(ctx, S.rider, { portal: level.portal, endT: S.endT });
        hud(ctx, S.rider);
      }
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
// App wiring: editor UI, input, game loop, save/load.
(function () {
  const { LEVELS, WORLD, Track, Physics, Render } = window.MTB;
  const $ = (s) => document.querySelector(s);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const SAVE_KEY = 'mtb-portal-v2';
  const OLD_KEY = 'mtb-portal-sandbox-v1';

  const canvas = $('#game');
  const ctx = canvas.getContext('2d');
  const stage = $('#stage');

  const S = {
    li: 0, level: clone(LEVELS[0]),
    pieces: [], built: null, invalid: new Set(), sel: 0,
    mode: 'edit', rider: null, segs: null, endT: 0, ended: false,
    lastTrail: null, lastEnd: null, t: 0,
  };
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  // ---------- save / load ----------
  let save = { level: 0, unlocked: 1, tracks: {}, best: {}, portals: {} };
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (d && d.tracks) save = Object.assign(save, d);
      else {
        const old = JSON.parse(localStorage.getItem(OLD_KEY)); // carry over the first version's sandbox run
        if (old && Array.isArray(old.pieces)) { save.tracks.sandbox = old.pieces; if (old.portal) save.portals.sandbox = old.portal; }
      }
    } catch (e) { /* ignore */ }
  }
  function persist() {
    try {
      save.level = S.li;
      save.tracks[S.level.id] = S.pieces;
      if (S.level.draggable) save.portals[S.level.id] = { x: S.level.portal.x, y: S.level.portal.y };
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) { /* ignore */ }
  }
  const isFree = (i) => !!(LEVELS[i] && LEVELS[i].draggable);
  const unlocked = (i) => i >= 0 && i < LEVELS.length && (isFree(i) || i < save.unlocked);
  function starsFor(L, n) { return !L.par ? 0 : n <= L.par ? 3 : n <= L.par + 2 ? 2 : 1; }
  const starStr = (k) => '★'.repeat(k) + '☆'.repeat(3 - k);

  function loadLevel(i) {
    if (S.mode !== 'edit') toEdit();
    S.li = Math.max(0, Math.min(LEVELS.length - 1, i));
    S.level = clone(LEVELS[S.li]);
    const pp = save.portals[S.level.id];
    if (S.level.draggable && pp) Object.assign(S.level.portal, pp);
    S.pieces = clone(save.tracks[S.level.id] || S.level.start);
    S.sel = Math.max(0, S.pieces.length - 1);
    S.lastTrail = null;
    S.lastEnd = null;
    rebuild();
    renderStrip();
    renderProps();
    renderLevelBar();
  }

  function renderLevelBar() {
    const L = S.level, b = save.best[L.id];
    $('#lvlName').innerHTML = `<span class="lvnum">${isFree(S.li) ? '∞' : S.li + 1}</span> ${L.name}` +
      (L.par ? ` <span class="stars">${starStr(b ? b.stars : 0)}</span>` : '');
    $('#hint').textContent = L.hint;
    $('#prevLvl').disabled = S.li === 0;
    $('#nextLvl').disabled = S.li === LEVELS.length - 1;
    $('#nextLvl').classList.toggle('locked', !unlocked(S.li + 1));
    const menu = $('#lvlMenu');
    menu.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const bb = save.best[lv.id];
      const btn = document.createElement('button');
      btn.className = 'lvitem' + (i === S.li ? ' cur' : '');
      btn.disabled = !unlocked(i);
      btn.innerHTML = `<span class="lvnum">${isFree(i) ? '∞' : i + 1}</span><span class="lvn">${lv.name}</span>` +
        (lv.par ? `<span class="stars">${unlocked(i) ? starStr(bb ? bb.stars : 0) : '🔒'}</span>` : '');
      btn.onclick = () => { menu.classList.add('hidden'); loadLevel(i); };
      menu.appendChild(btn);
    });
  }

  function rebuild() {
    S.built = Track.build(S.pieces);
    S.invalid = Track.validate(S.built, S.level);
    persist();
    const n = S.pieces.length;
    $('#pieceCount').textContent = `${n} piece${n === 1 ? '' : 's'}` + (S.level.par ? ` · par ${S.level.par}` : '');
    document.querySelectorAll('.chip').forEach((el) => {
      const i = +el.dataset.i;
      el.classList.toggle('bad', S.invalid.has(i));
    });
  }

  // Track-piece icons (inline SVG so they inherit the button colour)
  const ICONS = {
    ramp: '<svg viewBox="0 0 40 28" class="pico"><path d="M3 6 L37 22" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M11 10 V27 M19 14 V27 M27 18 V27" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M3 6 L37 22" stroke="#c99661" stroke-width="1.4" stroke-linecap="round"/></svg>',
    curve: '<svg viewBox="0 0 40 28" class="pico"><path d="M3 5 Q8 24 22 24 Q32 24 37 12" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M12 19 V27 M22 24 V27 M31 20 V27" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M3 5 Q8 24 22 24 Q32 24 37 12" stroke="#c99661" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>',
    gap: '<svg viewBox="0 0 40 28" class="pico"><path d="M2 16 Q8 16 12 11" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M28 13 L38 22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M13 9 Q20 0 27 11" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 3" fill="none"/><path d="M7 15 V27 M33 18 V27" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg>',
  };

  // ---------- editor UI ----------
  function chipLabel(pc, i) {
    const T = Track.TYPES[pc.type];
    return `<span class="num">${i + 1}</span><span class="ic">${ICONS[pc.type]}</span><span class="nm">${T.label}</span><span class="sub">${Track.describe(pc)}</span>`;
  }

  function renderStrip() {
    const strip = $('#strip');
    strip.innerHTML = '';
    S.pieces.forEach((pc, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === S.sel ? ' sel' : '') + (S.invalid.has(i) ? ' bad' : '');
      b.dataset.i = i;
      b.innerHTML = chipLabel(pc, i);
      b.onclick = () => select(i);
      strip.appendChild(b);
    });
    if (!S.pieces.length) strip.innerHTML = '<div class="empty">No pieces yet. Add a ramp to drop in!</div>';
    const selEl = strip.querySelector('.chip.sel');
    if (selEl) selEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function fmt(pc, k, v) {
    if (k === 'angle' || k === 'landAngle') {
      if (v === 0) return 'flat';
      const pct = Math.round(Math.tan((Math.abs(v) * Math.PI) / 180) * 100);
      return `${Math.abs(v)}° ${v > 0 ? 'down' : 'up'}${Math.abs(v) < 80 ? ` · ${pct}%` : ''}`;
    }
    if (k === 'turn') return v >= 0 ? `${v}° up` : `${-v}° roll-over`;
    if (k === 'drop') return v >= 0 ? `${v} lower` : `${-v} higher`;
    return `${v}`;
  }

  function renderProps() {
    const box = $('#props');
    const pc = S.pieces[S.sel];
    if (!pc) { box.innerHTML = '<div class="empty">Select a piece to tune it.</div>'; return; }
    const T = Track.TYPES[pc.type];
    box.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'prop-head';
    head.innerHTML = `<strong><span class="hic">${ICONS[pc.type]}</span>${S.sel + 1}. ${T.label}</strong>
      <span class="acts">
        <button data-act="left" title="Move earlier">◀</button>
        <button data-act="right" title="Move later">▶</button>
        <button data-act="dup" title="Duplicate">⧉</button>
        <button data-act="del" class="danger" title="Delete">✕</button>
      </span>`;
    box.appendChild(head);
    head.querySelectorAll('button').forEach((b) => (b.onclick = () => act(b.dataset.act)));

    for (const p of T.params) {
      const row = document.createElement('div');
      row.className = 'prop';
      row.innerHTML = `<label>${p.label}<span class="val"></span></label>
        <div class="ctl"><button class="step" data-d="-1">−</button>
        <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${pc[p.k]}">
        <button class="step" data-d="1">+</button></div>`;
      const input = row.querySelector('input');
      const val = row.querySelector('.val');
      const set = (v) => {
        v = Math.max(p.min, Math.min(p.max, Math.round(v / p.step) * p.step));
        pc[p.k] = v;
        input.value = v;
        val.textContent = fmt(pc, p.k, v);
        rebuild();
        const chip = document.querySelector(`.chip[data-i="${S.sel}"]`);
        if (chip) chip.innerHTML = chipLabel(pc, S.sel);
      };
      val.textContent = fmt(pc, p.k, pc[p.k]);
      input.oninput = () => set(+input.value);
      row.querySelectorAll('.step').forEach((b) => holdRepeat(b, () => set(pc[p.k] + +b.dataset.d * p.step)));
      box.appendChild(row);
    }
    if (pc.type === 'gap') {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.textContent = 'A gap leaves open air. The next piece starts at the landing point.';
      box.appendChild(tip);
    }
  }

  function holdRepeat(btn, fn) {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      fn();
      t1 = setTimeout(() => (t2 = setInterval(fn, 55)), 350);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
  }

  function select(i) {
    S.sel = Math.max(0, Math.min(S.pieces.length - 1, i));
    renderStrip();
    renderProps();
  }

  function act(a) {
    const i = S.sel, P = S.pieces;
    if (a === 'del') P.splice(i, 1), (S.sel = Math.min(i, P.length - 1));
    if (a === 'dup') P.splice(i + 1, 0, clone(P[i])), (S.sel = i + 1);
    if (a === 'left' && i > 0) [P[i - 1], P[i]] = [P[i], P[i - 1]], (S.sel = i - 1);
    if (a === 'right' && i < P.length - 1) [P[i + 1], P[i]] = [P[i], P[i + 1]], (S.sel = i + 1);
    rebuild();
    renderStrip();
    renderProps();
  }

  function addPiece(type) {
    const pc = Track.TYPES[type].make();
    const at = S.pieces.length ? S.sel + 1 : 0;
    S.pieces.splice(at, 0, pc);
    S.sel = at;
    rebuild();
    renderStrip();
    renderProps();
  }

  // ---------- ride ----------
  function ride() {
    hideOverlay();
    if (S.invalid.size) return toast('Red pieces hit a no-build zone or leave the map. Fix them first.');
    S.mode = 'ride';
    S.rider = Physics.createRider();
    S.segs = S.built.segments.concat(Track.groundSegments(S.level));
    S.endT = 0;
    S.ended = false;
    acc = 0;
    document.body.classList.add('riding');
    $('#rideBtn').innerHTML = '■ Stop';
  }

  function toEdit() {
    hideOverlay();
    if (S.rider) {
      S.lastTrail = S.rider.trail.slice();
      S.lastEnd = { x: S.rider.x, y: S.rider.y, state: S.rider.state };
    }
    S.mode = 'edit';
    S.rider = null;
    document.body.classList.remove('riding');
    $('#rideBtn').innerHTML = '▶ Ride';
  }

  function onEnd() {
    const r = S.rider;
    const delay = r.state === 'finished' ? 900 : r.state === 'crashed' ? 1300 : 500;
    setTimeout(() => {
      if (S.rider !== r) return;
      if (r.state === 'finished') {
        const L = S.level, n = S.pieces.length, st = starsFor(L, n);
        if (L.par) {
          const prev = save.best[L.id];
          if (!prev || st > prev.stars || (st === prev.stars && r.t < prev.time)) save.best[L.id] = { stars: st, time: r.t, pieces: n };
          if (S.li + 1 >= save.unlocked) save.unlocked = S.li + 2;
          persist();
          renderLevelBar();
        }
        const more = L.par && n > L.par ? ` Beat par (${L.par}) for 3 stars.` : '';
        showOverlay(L.par ? `Portal reached! ${starStr(st)}` : 'Portal reached! 🎉',
          `Time ${r.t.toFixed(2)}s · top speed ${Math.round(r.maxSpeed * 0.16)} km/h · ${n} piece${n === 1 ? '' : 's'}.${more}`, true);
      } else if (r.state === 'crashed') {
        showOverlay('Crashed!', r.msg, false);
      } else {
        showOverlay('Stopped', r.msg, false);
      }
    }, delay);
  }

  function showOverlay(title, msg, win) {
    $('#ovTitle').textContent = title;
    $('#ovMsg').textContent = msg;
    $('#overlay').classList.toggle('win', win);
    const hasNext = win && S.li < LEVELS.length - 1;
    $('#ovNext').classList.toggle('hidden', !hasNext);
    if (hasNext) $('#ovNext').textContent = isFree(S.li + 1) ? 'Free Ride →' : 'Next level →';
    $('#ovRetry').className = hasNext ? 'ghost' : 'primary';
    $('#overlay').classList.remove('hidden');
  }
  function hideOverlay() { $('#overlay').classList.add('hidden'); }

  let toastT;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- canvas input ----------
  function toWorld(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left - view.ox) / view.scale, y: (e.clientY - rect.top - view.oy) / view.scale };
  }
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (S.mode !== 'edit') return;
    const p = toWorld(e);
    const P = S.level.portal;
    if (S.level.draggable && Math.hypot(p.x - P.x, p.y - P.y) < P.r * 1.3) {
      drag = { dx: P.x - p.x, dy: P.y - p.y };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
      return;
    }
    // pick nearest track piece
    let best = -1, bd = 30;
    for (const s of S.built.segments) {
      if (s.p < 0) continue;
      const t = Math.max(0, Math.min(s.len, (p.x - s.ax) * s.tx + (p.y - s.ay) * s.ty));
      const d = Math.hypot(p.x - (s.ax + s.tx * t), p.y - (s.ay + s.ty * t));
      if (d < bd) { bd = d; best = s.p; }
    }
    if (best >= 0) select(best);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = toWorld(e), P = S.level.portal;
    P.x = Math.round(Math.max(P.r, Math.min(WORLD.W - P.r, p.x + drag.dx)));
    P.y = Math.round(Math.max(P.r, Math.min(WORLD.H - 20, p.y + drag.dy)));
  });
  const endDrag = () => { if (drag) { drag = null; canvas.classList.remove('dragging'); persist(); } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- buttons & keys ----------
  $('#rideBtn').onclick = () => (S.mode === 'edit' ? ride() : toEdit());
  $('#ovRetry').onclick = ride;
  $('#ovEdit').onclick = toEdit;
  $('#ovNext').onclick = () => loadLevel(S.li + 1);
  $('#prevLvl').onclick = () => loadLevel(S.li - 1);
  $('#nextLvl').onclick = () => (unlocked(S.li + 1) ? loadLevel(S.li + 1) : toast('Reach the portal to unlock the next level.'));
  $('#lvlName').onclick = (e) => { e.stopPropagation(); $('#lvlMenu').classList.toggle('hidden'); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#lvlMenu')) $('#lvlMenu').classList.add('hidden'); });
  $('#clearBtn').onclick = () => {
    if (!confirmClear()) return;
    S.pieces = clone(S.level.start);
    S.sel = 0;
    S.lastTrail = null;
    S.lastEnd = null;
    rebuild(); renderStrip(); renderProps();
  };
  let clearArmed = 0;
  function confirmClear() {
    if (Date.now() - clearArmed < 2500) return true;
    clearArmed = Date.now();
    toast('Tap Clear again to wipe your run.');
    return false;
  }
  document.querySelectorAll('[data-add]').forEach((b) => {
    b.innerHTML = `${ICONS[b.dataset.add]}<span>+ ${Track.TYPES[b.dataset.add].label}</span>`;
    b.onclick = () => addPiece(b.dataset.add);
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Enter') return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!$('#overlay').classList.contains('hidden')) ($('#ovNext').classList.contains('hidden') ? ride() : loadLevel(S.li + 1));
      else S.mode === 'edit' ? ride() : toEdit();
    } else if (e.key === 'Escape') toEdit();
    else if (S.mode === 'edit' && (e.key === 'Delete' || e.key === 'Backspace') && S.pieces.length) act('del');
  });

  // ---------- layout & loop ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * view.dpr);
    canvas.height = Math.round(h * view.dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    view.scale = Math.min(w / WORLD.W, h / WORLD.H);
    view.ox = (w - WORLD.W * view.scale) / 2;
    view.oy = (h - WORLD.H * view.scale) / 2;
  }
  new ResizeObserver(resize).observe(stage);

  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    S.t += dt;
    if (S.mode === 'ride' && S.rider) {
      acc += dt;
      while (acc >= Physics.SUB) { Physics.step(S.rider, S.segs, S.level); acc -= Physics.SUB; }
      if (S.rider.state !== 'riding') {
        S.endT += dt;
        if (!S.ended) { S.ended = true; onEnd(); }
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0f131b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = view.scale * view.dpr;
    ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, WORLD.W, WORLD.H); ctx.clip();
    Render.draw(ctx, S);
    ctx.restore();
    requestAnimationFrame(frame);
  }

  load();
  resize();
  loadLevel(unlocked(save.level) ? save.level : 0);
  requestAnimationFrame(frame);

  // exposed for debugging / tests
  window.MTB.app = { S, ride, toEdit, addPiece, select, loadLevel, save: () => save };
})();

</script>
