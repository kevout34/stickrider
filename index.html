<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Snowboarding Bear</title>
  <meta name="theme-color" content="#0e1a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snowboarding Bear">
  <style>
:root {
  --bg: #0e1a2b;
  --panel: #13233a;
  --panel2: #1b3150;
  --line: #2a4466;
  --text: #e9eef7;
  --muted: #93a0b5;
  --accent: #4cc9ff;
  --accent-ink: #032238;
  --sel: #ffcc33;
  --bad: #ff4d4d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

#app {
  height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* top bar */
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; letter-spacing: 0.2px; white-space: nowrap; }
.logo { text-shadow: none; }
#hint { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.pill { font-size: 12px; color: var(--muted); background: var(--panel2); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.primary { white-space: nowrap; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 18px; font-weight: 800; }
.primary:active { transform: translateY(1px); }
.ghost { white-space: nowrap; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--text); }
body.riding #rideBtn { background: #ff6b4a; color: #2b0a02; }

/* stage */
#stage { position: relative; min-height: 0; overflow: hidden; }
#game { display: block; touch-action: none; cursor: pointer; }
#game.dragging { cursor: grabbing; }

#overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,10,16,0.45);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
#overlay.hidden { display: none; }
.card .row { flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px;
  max-width: min(420px, 90%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
.card h2 { margin: 0 0 6px; font-size: 22px; }
#overlay.win .card h2 { color: #8fdcff; }
.card p { margin: 0 0 16px; color: var(--muted); line-height: 1.4; }
.card .row { display: flex; gap: 10px; justify-content: center; }

#toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0;
  background: rgba(20,24,34,0.95); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
  font-size: 14px; pointer-events: none; transition: 0.2s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* editor */
#editor { background: var(--panel); border-top: 1px solid var(--line); display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 420px); gap: 10px; padding: 10px 12px; transition: opacity 0.2s; }
body.riding #editor { opacity: 0.45; pointer-events: none; }
.strip-wrap { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; column-gap: 6px;
  align-items: center; text-align: left; background: var(--panel2); border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; }
.chip .num { grid-row: 1 / 3; font-size: 11px; color: var(--muted); }
.chip .ic { grid-row: 1 / 3; color: #3f6f9f; display: flex; }
.chip .nm { font-weight: 700; font-size: 13px; }
.chip .sub { font-size: 11px; color: var(--muted); grid-column: 3; }
.chip.sel { border-color: var(--sel); }
.chip.bad { border-color: var(--bad); background: #3a1d22; }
#addRow { display: flex; gap: 6px; flex-wrap: wrap; }
#addRow button { background: transparent; border: 1px dashed #4a6a95; border-radius: 10px; padding: 7px 12px; font-weight: 600; color: #cdd7e8; }
#addRow button:active { background: var(--panel2); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }

#props { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prop-head { display: flex; align-items: center; justify-content: space-between; }
.prop-head .acts { display: flex; gap: 4px; }
.prop-head .acts button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 30px; padding: 0; }
.prop-head .acts .danger { color: #ff8a7a; }
.prop label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.prop .val { color: var(--text); font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 6px; }
.step { width: 30px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); padding: 0; font-weight: 700; flex: 0 0 auto; }
.tip { font-size: 12px; color: var(--muted); }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #334058; border-radius: 3px; }
input[type=range]::-moz-range-track { height: 6px; background: #334058; border-radius: 3px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--sel); border: 2px solid #3d2f00; }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--sel); border: 2px solid #3d2f00; }

/* narrow portrait */
@media (max-width: 720px) {
  #hint { display: none; }
  #editor { grid-template-columns: 1fr; }
  .brand { font-size: 15px; }
}
/* phone landscape: editor becomes a sidebar */
@media (orientation: landscape) and (max-height: 520px) {
  #app { grid-template-columns: 1fr 270px; grid-template-rows: auto 1fr; }
  #hint { display: none; }
  #editor { grid-row: 2; grid-column: 2; grid-template-columns: 1fr; border-top: 0; border-left: 1px solid var(--line);
    overflow-y: auto; align-content: start; }
  #strip { flex-wrap: wrap; overflow: visible; }
}

/* level navigation */
.lvlnav { position: relative; display: flex; align-items: center; gap: 4px; }
.navbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 34px; padding: 0; font-size: 20px; line-height: 1; }
.navbtn:disabled { opacity: 0.35; }
.navbtn.locked { opacity: 0.5; }
#lvlName { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 12px; font-weight: 700; white-space: nowrap; }
.lvnum { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: #4cc9ff; color: #032238; font-size: 12px; font-weight: 800; margin-right: 4px; }
.stars { color: var(--sel); letter-spacing: 1px; font-size: 13px; margin-left: 4px; }
#lvlMenu { position: absolute; top: 40px; left: 36px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 240px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 2px; }
#lvlMenu.hidden { display: none; }
.lvitem { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; text-align: left; }
.lvitem:hover:not(:disabled), .lvitem.cur { background: var(--panel2); }
.lvitem:disabled { opacity: 0.45; cursor: default; }
.lvitem .lvn { flex: 1; font-weight: 600; }
.hidden { display: none !important; }
@media (max-width: 720px) {
  .brand { display: none; }
  #topbar { flex-wrap: wrap; row-gap: 6px; }
  .lvlnav { flex: 1 1 100%; }
  #lvlName { flex: 1; padding: 0 8px; font-size: 14px; text-align: left; }
  #lvlMenu { left: 0; right: 0; }
}

/* piece icons */
.pico { width: 34px; height: 24px; display: block; }
.chip .ic { background: #d7e7f6; border-radius: 7px; padding: 2px 3px; }
.chip.sel .ic { background: #fff1c2; }
#addRow button { display: flex; align-items: center; gap: 6px; color: #9fd3ff; }
#addRow button span { color: #cdd7e8; }
#addRow .pico { width: 30px; height: 21px; }
.hic { display: inline-flex; vertical-align: middle; margin-right: 6px; color: #9fd3ff; }
.hic .pico { width: 30px; height: 21px; }

/* undo */
#undoBtn:disabled { opacity: 0.35; cursor: default; }

/* props layout + vertical "Bend" slider */
.prop-body { display: flex; flex-direction: column; gap: 6px; }
.prop-body.has-v { flex-direction: row; align-items: stretch; gap: 12px; }
.prop-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.vprop { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; width: 84px; }
.vprop label { justify-content: center; }
.vprop .val { font-size: 12px; text-align: center; white-space: nowrap; }
.vwrap { position: relative; width: 34px; height: 120px; }
.vwrap input[type=range] { position: absolute; left: 50%; top: 50%; width: 120px; height: 34px; margin: 0;
  transform: translate(-50%, -50%) rotate(-90deg); }

/* pro / paywall */
.pro { white-space: nowrap; background: linear-gradient(135deg, #ffd56b, #ffb238); color: #3a2500; border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 800; }
.lvsep { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); padding: 8px 10px 2px; display: flex; justify-content: space-between; }
.lvsep span { text-transform: none; letter-spacing: 0; color: var(--sel); }
.lvitem.prem .lvnum { background: #ffc94a; color: #3a2500; }
.probadge { font-size: 10px; font-weight: 800; background: linear-gradient(135deg, #ffd56b, #ffb238); color: #3a2500; border-radius: 6px; padding: 2px 6px; }
#paywall { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,10,16,0.6); z-index: 30;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); overflow-y: auto; padding: 10px; }
.card.pw { position: relative; max-width: 420px; width: 100%; text-align: center; max-height: calc(100dvh - 20px); overflow-y: auto; padding: 16px 20px; }
.pwx { position: absolute; top: 10px; right: 10px; background: transparent; border: 0; color: var(--muted); font-size: 18px; }
.crown { font-size: 34px; line-height: 1; }
.pwsub { margin: 4px 0 10px !important; }
.pwsub strong { color: var(--sel); font-size: 18px; }
#pwLevels { list-style: none; margin: 0 0 14px; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; }
#pwLevels li { background: var(--panel2); border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: 14px; }
#pwLevels li .lvnum { background: #ffc94a; color: #3a2500; }
#pwLevels small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.primary.big { width: 100%; padding: 13px; font-size: 16px; }
.primary:disabled { opacity: 0.5; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; margin-top: 8px; font-size: 13px; }
.fine { font-size: 11px !important; color: var(--muted); margin: 8px 0 0 !important; }
.fine a { color: var(--muted); }
@media (max-height: 760px) { #pwLevels small { display: none; } #pwLevels li { padding: 5px 10px; } }
@media (max-height: 520px) {
  .crown { display: none; }
  #pwLevels { display: grid; grid-template-columns: 1fr 1fr; }
  .card.pw h2 { font-size: 19px; }
  .pwsub { font-size: 13px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .brand, .pill { display: none; }
  #topbar { gap: 6px; padding: 6px 10px; }
  #topbar button { padding-left: 10px; padding-right: 10px; }
}

/* version label */
.ver { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.lvfoot { font-size: 11px; color: var(--muted); text-align: right; padding: 6px 10px 2px; border-top: 1px solid var(--line); margin-top: 4px; }

</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">🐻</span> Snowboarding Bear <span id="ver" class="ver"></span></div>
      <div class="lvlnav">
        <button id="prevLvl" class="navbtn" aria-label="Previous level">‹</button>
        <button id="lvlName"></button>
        <button id="nextLvl" class="navbtn" aria-label="Next level">›</button>
        <div id="lvlMenu" class="hidden"></div>
      </div>
      <div id="hint"></div>
      <div class="spacer"></div>
      <span id="pieceCount" class="pill"></span>
      <button id="proBtn" class="pro" title="Unlock Pro Runs">👑 Pro</button>
      <button id="undoBtn" class="ghost" title="Undo (Ctrl/Cmd+Z)" disabled>↶ Undo</button>
      <button id="clearBtn" class="ghost">Clear</button>
      <button id="rideBtn" class="primary">▶ Ride</button>
    </header>

    <main id="stage">
      <canvas id="game" aria-label="Game canvas"></canvas>
      <div id="overlay" class="hidden">
        <div class="card">
          <h2 id="ovTitle"></h2>
          <p id="ovMsg"></p>
          <div class="row">
            <button id="ovEdit" class="ghost">✎ Edit run</button>
            <button id="ovRetry" class="primary">↻ Ride again</button>
            <button id="ovNext" class="primary hidden">Next level →</button>
          </div>
        </div>
      </div>
      <div id="paywall" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
        <div class="card pw">
          <button id="pwClose" class="pwx" aria-label="Close">✕</button>
          <div class="crown">👑</div>
          <h2 id="pwTitle">Unlock Pro Runs</h2>
          <p class="pwsub">5 harder levels: multi-gap runs, horizontal crevices and more.<br><strong id="pwPrice"></strong></p>
          <ul id="pwLevels"></ul>
          <button id="pwBuy" class="primary big">Subscribe</button>
          <button id="pwRestore" class="linkbtn">Restore purchases</button>
          <p id="pwFine" class="fine"></p>
        </div>
      </div>
      <div id="toast"></div>
    </main>

    <section id="editor">
      <div class="strip-wrap">
        <div id="strip"></div>
        <div id="addRow">
          <button data-add="ramp">+ Ramp</button>
          <button data-add="curve">+ Curve</button>
          <button data-add="gap">+ Gap</button>
        </div>
      </div>
      <div id="props"></div>
    </section>
  </div>

  <script>
// Game version. Bump this (and add a CHANGELOG.md entry) for each saved release.
(function (G) {
  const MTB = (G.MTB = G.MTB || {});
  MTB.VERSION = '1.1';
  MTB.GAME = 'Snowboarding Bear';
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
// Level definitions. World is 1600 x 900 units, y grows downward.
// ground:    fixed dirt surfaces (polylines, listed left -> right)
// hazards:   rectangles that crash the rider on contact (type: 'spikes' | 'wall')
// noBuild:   rectangles your track may not pass through (forces jumps)
// portal:    the finish line. ground:true = must be rolling on the ground (no flying in); label = custom sign text
// par:       piece count for 3 stars
// draggable: portal can be moved by the player (Free Ride)
// premium:   requires the annual subscription
// tools:     which track pieces can be used (default: all)
(function (G) {
  const MTB = (G.MTB = G.MTB || {});

    {

    const sg = ctx.createRadialGradient(1380, 130, 8, 1380, 130, 110);
    sg.addColorStop(0, 'rgba(255,255,240,1)');
    sg.addColorStop(0.35, 'rgba(255,250,220,0.6)');
    sg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(1260, 10, 240, 240);
    // far peaks, heavily snow-capped
    fillHills(ctx, far, '#a8c2dc');
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let k = 2; k < far.length - 2; k++) {
      const [x, y] = far[k];
      if (y < far[k - 2][1] && y < far[k + 2][1]) {
        ctx.beginPath();
        ctx.moveTo(x - 42, y + 30); ctx.lineTo(x - 14, y + 20); ctx.lineTo(x, y); ctx.lineTo(x + 16, y + 22); ctx.lineTo(x + 42, y + 30);
        ctx.closePath(); ctx.fill();
      }
    }
    // haze between ranges
    const hz = ctx.createLinearGradient(0, 420, 0, 640);
    hz.addColorStop(0, 'rgba(235,244,252,0)');
    hz.addColorStop(1, 'rgba(235,244,252,0.55)');
    ctx.fillStyle = hz;
    ctx.fillRect(0, 380, W, 300);
    fillHills(ctx, mid, '#d2e1ee');
    for (const [x, y, h] of midTrees) pine(ctx, x, y, h, '#7d9ca6', '#6b8790');
    fillHills(ctx, near, '#e8f0f7');
    for (const [x, y, h] of nearTrees) pine(ctx, x, y, h, '#3d6656', '#4a3526');
  }

  function snowfall(ctx, t) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const [x0, y0, r, sp, ph] of flakes) {
      const y = (y0 + t * sp) % H;
      const x = (x0 + Math.sin(t * 0.8 + ph) * 12 + t * 6) % W;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function grid(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 100; x < W; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 100; y < H; y += 100) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  function snowSurface(ctx, pts, fill) {
    // fill down to the bottom like a snow bank, then a crisp top edge
    if (fill) {
      const g = ctx.createLinearGradient(0, Math.min(...pts.map((p) => p.y)), 0, H);
      g.addColorStop(0, '#fbfdff');
      g.addColorStop(1, '#cfdeec');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, H);
      for (const p of pts) ctx.lineTo(p.x, p.y);
      ctx.lineTo(pts[pts.length - 1].x, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.strokeStyle = '#8fb0cf';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y - 1.5) : ctx.moveTo(p.x, p.y - 1.5)));
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  function ground(ctx, level) {
    for (const pl of level.ground) snowSurface(ctx, pl.map(([x, y]) => ({ x, y })), true);
  }

  function zones(ctx, level) {
    for (const z of level.noBuild) {
      ctx.fillStyle = 'rgba(255,70,70,0.10)';
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(255,70,70,0.5)';
      ctx.setLineDash([10, 8]);
      ctx.lineWidth = 2;
      ctx.strokeRect(z.x, z.y, z.w, z.h);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(200,40,40,0.75)';
      ctx.font = '800 16px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NO BUILD', z.x + z.w / 2, z.y + 28);
    }
    for (const h of level.hazards) {
      if (h.type === 'spikes') {
        // ice spikes
        ctx.fillStyle = '#6f8aa6';
        ctx.fillRect(h.x, h.y + h.h * 0.6, h.w, h.h * 0.4);
        for (let x = h.x; x < h.x + h.w; x += 16) {
          const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h * 0.6);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(1, '#8fd3ff');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.moveTo(x, h.y + h.h * 0.6); ctx.lineTo(x + 8, h.y); ctx.lineTo(x + 16, h.y + h.h * 0.6); ctx.fill();
        }
      } else {
        // rock cliff with snow on top ledges
        ctx.fillStyle = '#6b7280';
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.strokeStyle = '#4b5260';
        ctx.lineWidth = 3;
        ctx.strokeRect(h.x, h.y, h.w, h.h);
        ctx.fillStyle = '#ffffff';
        if (h.y > 0) {
          ctx.beginPath();
          ctx.moveTo(h.x - 3, h.y + 2);
          ctx.quadraticCurveTo(h.x + h.w / 2, h.y - 12, h.x + h.w + 3, h.y + 2);
          ctx.lineTo(h.x + h.w + 3, h.y + 8);
          ctx.lineTo(h.x - 3, h.y + 8);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(190,225,255,0.8)';
        if (h.y + h.h < H) {
          for (let x = h.x + 6; x < h.x + h.w - 6; x += 14) {
            ctx.beginPath(); ctx.moveTo(x, h.y + h.h); ctx.lineTo(x + 4, h.y + h.h + 12); ctx.lineTo(x + 8, h.y + h.h); ctx.fill();
          }
        }
      }
    }
  }

  function track(ctx, built, opts) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const mark = (idx, color, w) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath();
      for (const s of built.segments) if (s.p === idx) { ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); }
      ctx.stroke();
    };
    for (const L of built.lines) if (L.length > 1) snowSurface(ctx, L, true);
    if (opts.invalid) for (const i of opts.invalid) mark(i, 'rgba(255,50,50,0.85)', 14);
    if (opts.selected != null && opts.editing) mark(opts.selected, 'rgba(255,190,40,0.9)', 12);

    // start hut + flag
    const D = MTB.Track.DECK;
    ctx.fillStyle = '#7a4a2a';
    ctx.fillRect(D.x1 - 4, D.y - 60, 5, 60);
    ctx.fillStyle = '#ff4f6d';
    ctx.beginPath(); ctx.moveTo(D.x1 + 1, D.y - 60); ctx.lineTo(D.x1 + 33, D.y - 50); ctx.lineTo(D.x1 + 1, D.y - 40); ctx.fill();

    if (opts.editing) {
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(40,80,130,0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 1; k < built.lines.length; k++) {
        const a = built.lines[k - 1], b = built.lines[k];
        const p = a[a.length - 1], q = b[0];
        ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      const e = built.pen, r = (e.h * Math.PI) / 180;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(r);
      ctx.fillStyle = 'rgba(40,80,130,0.85)';
      ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(10, -8); ctx.lineTo(10, 8); ctx.fill();
      ctx.restore();
    }
  }

  function portal(ctx, P, t, opts) {
    ctx.save();
    ctx.translate(P.x, P.y);
    const pulse = 1 + Math.sin(t * 3) * 0.04 + (opts.flash || 0) * 0.5;
    const g = ctx.createRadialGradient(0, 0, P.r * 0.2, 0, 0, P.r * 1.9 * pulse);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(120,200,255,0.55)');
    g.addColorStop(1, 'rgba(90,120,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, P.r * 1.9 * pulse, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(t * (1.2 + i * 0.45) * (i % 2 ? -1 : 1));
      ctx.strokeStyle = `hsla(${200 + i * 25}, 95%, ${58 + i * 6}%, 0.95)`;
      ctx.lineWidth = 5 - i;
      const rr = P.r * (1 - i * 0.17) * pulse;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0.3, Math.PI * 1.55); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,40,120,0.85)';
    ctx.shadowBlur = 8;
    ctx.fillText(P.label || (P.ground ? 'FINISH · RIDE IN' : 'FINISH'), 0, -P.r - 14);
    if (opts.editing && opts.draggable) {
      ctx.shadowBlur = 0;
      ctx.font = '600 14px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(20,50,90,0.85)';
      ctx.fillText('drag to move', 0, P.r + 24);
    }
    ctx.restore();
  }

  // ---------- the bear ----------
  // Local coords (before the 1.5x scale): x = forward, y = down, snow surface at y = 9.
  const FUR = '#8a5a34', FUR_DARK = '#5e3b20', MUZZLE = '#d9ad7c', SCARF = '#e8364f';

  function board(ctx) {
    ctx.fillStyle = '#1f6feb';
    ctx.strokeStyle = '#0b2f66';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-26, 3);
    ctx.quadraticCurveTo(-25, 7.5, -20, 8.5);
    ctx.lineTo(20, 8.5);
    ctx.quadraticCurveTo(25, 7.5, 26, 3);
    ctx.quadraticCurveTo(24, 5.5, 20, 6);
    ctx.lineTo(-20, 6);
    ctx.quadraticCurveTo(-24, 5.5, -26, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(-6, 6.6, 12, 1.4);
    ctx.fillStyle = '#222';
    ctx.fillRect(-12, 4.2, 6, 2.2);
    ctx.fillRect(6, 4.2, 6, 2.2);
  }

  function limb(ctx, pts, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }

  function bear(ctx, t, air, speed) {
    const crouch = air ? -2 : Math.min(2, speed / 300); // tuck lower at speed
    const hipY = -11 + crouch;
    // legs (back leg first)
    limb(ctx, [[-9, 4], [-8, -3 + crouch * 0.6], [-3, hipY]], 5.2, FUR_DARK);
    limb(ctx, [[9, 4], [7, -3 + crouch * 0.6], [3, hipY]], 5.2, FUR);
    // body
    ctx.save();
    ctx.translate(0, -20 + crouch);
    ctx.rotate(0.15);
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 11.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = MUZZLE;
    ctx.beginPath(); ctx.ellipse(2.5, 2, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const sh = [1.5, -27 + crouch];
    // back arm
    const back = air ? [[sh[0] - 2, sh[1]], [-9, sh[1] - 8], [-15, sh[1] - 12]] : [[sh[0] - 2, sh[1]], [-9, sh[1] + 1], [-15, sh[1] - 2]];
    limb(ctx, back, 4.4, FUR_DARK);
    // scarf with flapping tail
    const flap = Math.sin(t * 18) * 2.5;
    ctx.fillStyle = SCARF;
    ctx.beginPath(); ctx.ellipse(2.5, sh[1] - 1, 7.5, 3, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-3, sh[1] - 2);
    ctx.quadraticCurveTo(-10, sh[1] - 3 + flap, -17, sh[1] - 1 - flap);
    ctx.lineTo(-16, sh[1] + 3 - flap);
    ctx.quadraticCurveTo(-9, sh[1] + 2 + flap, -2, sh[1] + 1);
    ctx.closePath();
    ctx.fill();
    // head
    const hx = 4.5, hy = sh[1] - 9;
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.arc(hx - 5, hy - 6.5, 3.2, 0, Math.PI * 2); ctx.arc(hx + 4.5, hy - 7, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e7a6a0';
    ctx.beginPath(); ctx.arc(hx - 5, hy - 6.5, 1.5, 0, Math.PI * 2); ctx.arc(hx + 4.5, hy - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.arc(hx, hy, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = MUZZLE;
    ctx.beginPath(); ctx.ellipse(hx + 6, hy + 2, 4.6, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath(); ctx.ellipse(hx + 9.6, hy + 0.6, 1.8, 1.4, 0, 0, Math.PI * 2); ctx.fill();
    // goggles
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.ellipse(hx + 3.5, hy - 2.6, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(hx - 7.5, hy - 3); ctx.lineTo(hx, hy - 2.8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(hx + 4.6, hy - 3.4, 1.3, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hx + 7, hy + 3.2, 1.6, 0.2, Math.PI - 0.4); ctx.stroke();
    // front arm (on top)
    const front = air ? [[sh[0] + 1, sh[1]], [9, sh[1] - 7], [15, sh[1] - 13]] : [[sh[0] + 1, sh[1]], [9, sh[1] + 2], [15, sh[1] + 1]];
    limb(ctx, front, 4.4, FUR);
    ctx.fillStyle = FUR_DARK;
    for (const p of [back[2], front[2]]) { ctx.beginPath(); ctx.arc(p[0], p[1], 2.4, 0, Math.PI * 2); ctx.fill(); }
  }

  function tumblingBear(ctx, o, t) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot);
    ctx.scale(1.8, 1.8);
    limb(ctx, [[0, 6], [-8, 15]], 5, FUR_DARK);
    limb(ctx, [[0, 6], [8, 14]], 5, FUR);
    limb(ctx, [[0, -6], [-11, -2]], 4.4, FUR_DARK);
    limb(ctx, [[0, -6], [11, -10]], 4.4, FUR);
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 10.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SCARF;
    ctx.fillRect(-7, -9, 14, 4);
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.arc(-5, -22, 3, 0, Math.PI * 2); ctx.arc(5, -22, 3, 0, Math.PI * 2); ctx.arc(0, -16, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = MUZZLE;
    ctx.beginPath(); ctx.ellipse(0, -13, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.2;
    // dizzy X eyes
    for (const ex of [-3, 3]) { ctx.beginPath(); ctx.moveTo(ex - 1.3, -19.3); ctx.lineTo(ex + 1.3, -16.7); ctx.moveTo(ex + 1.3, -19.3); ctx.lineTo(ex - 1.3, -16.7); ctx.stroke(); }
    ctx.restore();
    // little dizzy stars
    ctx.fillStyle = '#ffd23f';
    for (let i = 0; i < 3; i++) {
      const a = t * 4 + (i * Math.PI * 2) / 3;
      ctx.beginPath(); ctx.arc(o.x + Math.cos(a) * 22, o.y - 42 + Math.sin(a) * 6, 2.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  function rider(ctx, r, opts) {
    if (r.state === 'crashed' && r.bike) {
      ctx.save(); ctx.translate(r.bike.x, r.bike.y); ctx.rotate(r.bike.rot); ctx.scale(1.8, 1.8); board(ctx); ctx.restore();
      tumblingBear(ctx, r.body, opts.t);
      return;
    }
    ctx.save();
    let x = r.x, y = r.y, s = 1;
    if (r.state === 'finished' && opts.portal) {
      const k = Math.min(1, opts.endT / 0.5);
      x += (opts.portal.x - x) * k; y += (opts.portal.y - y) * k; s = 1 - k;
    }
    ctx.translate(x, y);
    ctx.rotate(r.ang);
    // draw 1.8x the physics circle, keeping the board base on the snow (local y = 9)
    ctx.translate(0, -7.2 * s);
    ctx.scale(1.8 * s, 1.8 * s);
    board(ctx);
    bear(ctx, opts.t, !r.grounded, Math.hypot(r.vx || 0, r.vy || 0));
    ctx.restore();
  }

  function spray(ctx, parts) {
    for (const p of parts) {
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.life / p.max) * 0.9})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function trail(ctx, pts) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.setLineDash([3, 7]);
    ctx.strokeStyle = 'rgba(30,70,130,0.75)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
    ctx.restore();
  }

  function crashMark(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.strokeStyle = '#ff3b3b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.moveTo(9, -9); ctx.lineTo(-9, 9); ctx.stroke();
    ctx.restore();
  }

  function hud(ctx, r) {
    const kmh = Math.round(Math.hypot(r.vx, r.vy) * 0.16);
    ctx.save();
    ctx.fillStyle = 'rgba(15,30,55,0.55)';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(W - 230, 18, 210, 62, 12) : ctx.rect(W - 230, 18, 210, 62);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 30px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${kmh}`, W - 214, 60);
    ctx.font = '600 14px system-ui, -apple-system, sans-serif';
    ctx.fillText('km/h', W - 214 + ctx.measureText(`${kmh}`).width * 2.2 + 6, 60);
    ctx.textAlign = 'right';
    ctx.font = '700 22px ui-monospace, Menlo, monospace';
    ctx.fillText(`${r.t.toFixed(2)}s`, W - 34, 58);
    ctx.restore();
  }

  MTB.Render = {
    draw(ctx, S) {
      const level = S.level;
      scenery(ctx, S.t);
      if (S.mode === 'edit') grid(ctx);
      zones(ctx, level);
      track(ctx, S.built, { selected: S.sel, invalid: S.invalid, editing: S.mode === 'edit' });
      ground(ctx, level);
      portal(ctx, level.portal, S.t, { editing: S.mode === 'edit', draggable: !!level.draggable, flash: S.rider && S.rider.state === 'finished' ? Math.max(0, 1 - S.endT) : 0 });
      if (S.mode === 'edit') {
        trail(ctx, S.lastTrail);
        if (S.lastEnd && S.lastEnd.state === 'crashed') crashMark(ctx, S.lastEnd);
        rider(ctx, MTB.Physics.createRider(), { t: S.t });
      } else if (S.rider) {
        spray(ctx, S.spray || []);
        rider(ctx, S.rider, { portal: level.portal, endT: S.endT, t: S.t });
        hud(ctx, S.rider);
      }
      snowfall(ctx, S.t);
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
// App wiring: editor UI, input, game loop, save/load.
(function () {
  const { LEVELS, WORLD, Track, Physics, Render, Store } = window.MTB;
  const $ = (s) => document.querySelector(s);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const SAVE_KEY = 'snowbear-v1';
  const OLD_KEY = 'snowbear-none';

  const canvas = $('#game');
  const ctx = canvas.getContext('2d');
  const stage = $('#stage');

  const S = {
    li: 0, level: clone(LEVELS[0]),
    pieces: [], built: null, invalid: new Set(), sel: 0,
    mode: 'edit', rider: null, segs: null, endT: 0, ended: false,
    lastTrail: null, lastEnd: null, t: 0,
  };
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  // ---------- save / load ----------
  let save = { level: 0, unlocked: 1, tracks: {}, best: {}, portals: {}, seenTools: ['ramp'] };
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (d && d.tracks) save = Object.assign(save, d);
      else {
        const old = JSON.parse(localStorage.getItem(OLD_KEY)); // carry over the first version's sandbox run
        if (old && Array.isArray(old.pieces)) { save.tracks.sandbox = old.pieces; if (old.portal) save.portals.sandbox = old.portal; }
      }
    } catch (e) { /* ignore */ }
  }
  function persist() {
    try {
      save.level = S.li;
      save.tracks[S.level.id] = S.pieces;
      if (S.level.draggable) save.portals[S.level.id] = { x: S.level.portal.x, y: S.level.portal.y };
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) { /* ignore */ }
  }
  const isFree = (i) => !!(LEVELS[i] && LEVELS[i].draggable);
  const progressOK = (i) => i >= 0 && i < LEVELS.length && (isFree(i) || i < save.unlocked);
  const needsPro = (i) => !!(LEVELS[i] && LEVELS[i].premium && !Store.isPro());
  const unlocked = (i) => progressOK(i) && !needsPro(i);
  function goTo(i) {
    if (i < 0 || i >= LEVELS.length) return;
    if (needsPro(i)) return showPaywall(i);
    if (!progressOK(i)) return toast('Reach the portal to unlock the next level.');
    loadLevel(i);
  }
  function starsFor(L, n) { return !L.par ? 0 : n <= L.par ? 3 : n <= L.par + 2 ? 2 : 1; }
  const starStr = (k) => '★'.repeat(k) + '☆'.repeat(3 - k);

  function loadLevel(i) {
    if (S.mode !== 'edit') toEdit();
    S.li = Math.max(0, Math.min(LEVELS.length - 1, i));
    S.level = clone(LEVELS[S.li]);
    const pp = save.portals[S.level.id];
    if (S.level.draggable && pp) Object.assign(S.level.portal, pp);
    S.pieces = clone(save.tracks[S.level.id] || S.level.start);
    S.sel = Math.max(0, S.pieces.length - 1);
    S.lastTrail = null;
    S.lastEnd = null;
    history = [];
    document.querySelectorAll('[data-add]').forEach((b) => b.classList.toggle('hidden', !allowed(b.dataset.add)));
    const fresh = Object.keys(Track.TYPES).filter((k) => allowed(k) && !save.seenTools.includes(k));
    if (fresh.length) {
      save.seenTools.push(...fresh);
      setTimeout(() => toast(`🎉 New piece unlocked: ${fresh.map((k) => Track.TYPES[k].label).join(' + ')}!`), 300);
    }
    rebuild();
    renderStrip();
    renderProps();
    renderLevelBar();
    updateUndo();
  }

  function renderLevelBar() {
    const L = S.level, b = save.best[L.id];
    $('#lvlName').innerHTML = `<span class="lvnum">${isFree(S.li) ? '∞' : S.li + 1}</span> ${L.name}` +
      (L.par ? ` <span class="stars">${starStr(b ? b.stars : 0)}</span>` : '');
    $('#hint').textContent = L.hint;
    $('#prevLvl').disabled = S.li === 0;
    $('#nextLvl').disabled = S.li === LEVELS.length - 1;
    $('#nextLvl').classList.toggle('locked', !unlocked(S.li + 1));
    $('#proBtn').classList.toggle('hidden', Store.isPro());
    const menu = $('#lvlMenu');
    menu.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      if (lv.premium && !(LEVELS[i - 1] && LEVELS[i - 1].premium)) {
        const h = document.createElement('div');
        h.className = 'lvsep';
        h.innerHTML = Store.isPro() ? '👑 Pro Runs' : `👑 Pro Runs <span>${Store.CONFIG.priceLabel}</span>`;
        menu.appendChild(h);
      }
      if (lv.draggable) { const h = document.createElement('div'); h.className = 'lvsep'; h.textContent = 'Sandbox'; menu.appendChild(h); }
      const bb = save.best[lv.id];
      const btn = document.createElement('button');
      const pro = needsPro(i);
      btn.className = 'lvitem' + (i === S.li ? ' cur' : '') + (lv.premium ? ' prem' : '');
      btn.disabled = !pro && !progressOK(i);
      const badge = pro ? '<span class="probadge">PRO</span>' : lv.par ? `<span class="stars">${progressOK(i) ? starStr(bb ? bb.stars : 0) : '🔒'}</span>` : '';
      btn.innerHTML = `<span class="lvnum">${isFree(i) ? '∞' : i + 1}</span><span class="lvn">${lv.name}</span>${badge}`;
      btn.onclick = () => { menu.classList.add('hidden'); goTo(i); };
      menu.appendChild(btn);
    });
    const ft = document.createElement('div');
    ft.className = 'lvfoot';
    ft.textContent = `${MTB.GAME} v${MTB.VERSION}`;
    menu.appendChild(ft);
  }

  const allowed = (type) => !S.level.tools || S.level.tools.includes(type);
  function rebuild() {
    S.built = Track.build(S.pieces);
    S.invalid = Track.validate(S.built, S.level);
    S.pieces.forEach((pc, i) => { if (!allowed(pc.type)) S.invalid.add(i); });
    persist();
    if (typeof updateUndo === 'function' && $('#undoBtn')) updateUndo();
    const n = S.pieces.length;
    $('#pieceCount').textContent = `${n} piece${n === 1 ? '' : 's'}` + (S.level.par ? ` · par ${S.level.par}` : '');
    document.querySelectorAll('.chip').forEach((el) => {
      const i = +el.dataset.i;
      el.classList.toggle('bad', S.invalid.has(i));
    });
  }

  // Track-piece icons (inline SVG so they inherit the button colour)
  const ICONS = {
    ramp: '<svg viewBox="0 0 40 28" class="pico"><path d="M3 5 L37 21 L37 27 L3 27 Z" fill="#eef5fb"/><path d="M3 5 L37 21" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>',
    curve: '<svg viewBox="0 0 40 28" class="pico"><path d="M3 4 Q8 23 22 23 Q32 23 37 11 L37 27 L3 27 Z" fill="#eef5fb"/><path d="M3 4 Q8 23 22 23 Q32 23 37 11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>',
    gap: '<svg viewBox="0 0 40 28" class="pico"><path d="M1 15 Q8 15 12 10 L12 27 L1 27 Z M28 12 L39 21 L39 27 L28 27 Z" fill="#eef5fb"/><path d="M1 15 Q8 15 12 10 M28 12 L39 21" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M13 8 Q20 -1 27 10" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 3" fill="none"/></svg>',
  };

  // ---------- undo ----------
  let history = [];
  const snap = () => JSON.stringify({ pieces: S.pieces, sel: S.sel, portal: S.level.draggable ? { x: S.level.portal.x, y: S.level.portal.y } : null });
  function checkpoint() {
    const s = snap();
    if (history[history.length - 1] !== s) history.push(s);
    if (history.length > 100) history.shift();
    updateUndo();
  }
  function undo() {
    if (S.mode !== 'edit') toEdit();
    let cur = snap(), prev;
    while (history.length && (prev = history.pop()) === cur);
    if (!prev || prev === cur) return updateUndo();
    const d = JSON.parse(prev);
    S.pieces = d.pieces;
    S.sel = Math.min(d.sel, S.pieces.length - 1);
    if (d.portal) Object.assign(S.level.portal, d.portal);
    rebuild(); renderStrip(); renderProps(); updateUndo();
  }
  function updateUndo() { $('#undoBtn').disabled = !history.length || (history.length === 1 && history[0] === snap()); }

  // ---------- editor UI ----------
  function chipLabel(pc, i) {
    const T = Track.TYPES[pc.type];
    return `<span class="num">${i + 1}</span><span class="ic">${ICONS[pc.type]}</span><span class="nm">${T.label}</span><span class="sub">${Track.describe(pc)}</span>`;
  }

  function renderStrip() {
    const strip = $('#strip');
    strip.innerHTML = '';
    S.pieces.forEach((pc, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === S.sel ? ' sel' : '') + (S.invalid.has(i) ? ' bad' : '');
      b.dataset.i = i;
      b.innerHTML = chipLabel(pc, i);
      b.onclick = () => select(i);
      strip.appendChild(b);
    });
    if (!S.pieces.length) strip.innerHTML = '<div class="empty">No pieces yet. Add a ramp to drop in!</div>';
    const selEl = strip.querySelector('.chip.sel');
    if (selEl) selEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function fmt(pc, k, v) {
    if (k === 'angle' || k === 'landAngle') {
      if (v === 0) return 'flat';
      const pct = Math.round(Math.tan((Math.abs(v) * Math.PI) / 180) * 100);
      return `${Math.abs(v)}° ${v > 0 ? 'down' : 'up'}${Math.abs(v) < 80 ? ` · ${pct}%` : ''}`;
    }
    if (k === 'turn') return v >= 0 ? `${v}° up` : `${-v}° roll-over`;
    if (k === 'drop') return v >= 0 ? `${v} lower` : `${-v} higher`;
    return `${v}`;
  }

  function renderProps() {
    const box = $('#props');
    const pc = S.pieces[S.sel];
    if (!pc) { box.innerHTML = '<div class="empty">Select a piece to tune it.</div>'; return; }
    const T = Track.TYPES[pc.type];
    box.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'prop-head';
    head.innerHTML = `<strong><span class="hic">${ICONS[pc.type]}</span>${S.sel + 1}. ${T.label}</strong>
      <span class="acts">
        <button data-act="left" title="Move earlier">◀</button>
        <button data-act="right" title="Move later">▶</button>
        <button data-act="dup" title="Duplicate">⧉</button>
        <button data-act="del" class="danger" title="Delete">✕</button>
      </span>`;
    box.appendChild(head);
    head.querySelectorAll('button').forEach((b) => (b.onclick = () => act(b.dataset.act)));

    const body = document.createElement('div');
    body.className = 'prop-body' + (T.params.some((p) => p.vertical) ? ' has-v' : '');
    const side = document.createElement('div');
    side.className = 'prop-side';
    box.appendChild(body);
    for (const p of T.params) {
      const row = document.createElement('div');
      const range = `<input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${pc[p.k]}" aria-label="${p.label}">`;
      if (p.vertical) {
        row.className = 'prop vprop';
        row.innerHTML = `<label>${p.label}</label><span class="val"></span>
          <button class="step" data-d="1">+</button>
          <div class="vwrap">${range}</div>
          <button class="step" data-d="-1">−</button>`;
      } else {
        row.className = 'prop';
        row.innerHTML = `<label>${p.label}<span class="val"></span></label>
        <div class="ctl"><button class="step" data-d="-1">−</button>
        ${range}
        <button class="step" data-d="1">+</button></div>`;
      }
      const input = row.querySelector('input');
      const val = row.querySelector('.val');
      const set = (v) => {
        v = Math.max(p.min, Math.min(p.max, Math.round(v / p.step) * p.step));
        pc[p.k] = v;
        input.value = v;
        val.textContent = fmt(pc, p.k, v);
        rebuild();
        const chip = document.querySelector(`.chip[data-i="${S.sel}"]`);
        if (chip) chip.innerHTML = chipLabel(pc, S.sel);
      };
      val.textContent = fmt(pc, p.k, pc[p.k]);
      input.oninput = () => set(+input.value);
      input.addEventListener('pointerdown', checkpoint);
      input.addEventListener('keydown', checkpoint);
      row.querySelectorAll('.step').forEach((b) => {
        b.addEventListener('pointerdown', checkpoint);
        holdRepeat(b, () => set(pc[p.k] + +b.dataset.d * p.step));
      });
      (p.vertical ? body : side).appendChild(row);
    }
    body.appendChild(side);
    if (pc.type === 'gap') {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.textContent = 'A gap leaves open air. The next piece starts at the landing point.';
      side.appendChild(tip);
    }
  }

  function holdRepeat(btn, fn) {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      fn();
      t1 = setTimeout(() => (t2 = setInterval(fn, 55)), 350);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
  }

  function select(i) {
    S.sel = Math.max(0, Math.min(S.pieces.length - 1, i));
    renderStrip();
    renderProps();
  }

  function act(a) {
    checkpoint();
    const i = S.sel, P = S.pieces;
    if (a === 'del') P.splice(i, 1), (S.sel = Math.min(i, P.length - 1));
    if (a === 'dup') P.splice(i + 1, 0, clone(P[i])), (S.sel = i + 1);
    if (a === 'left' && i > 0) [P[i - 1], P[i]] = [P[i], P[i - 1]], (S.sel = i - 1);
    if (a === 'right' && i < P.length - 1) [P[i + 1], P[i]] = [P[i], P[i + 1]], (S.sel = i + 1);
    rebuild();
    renderStrip();
    renderProps();
  }

  function addPiece(type) {
    if (!allowed(type)) return toast(`${Track.TYPES[type].label} isn't available on this level yet.`);
    checkpoint();
    const pc = Track.TYPES[type].make();
    const at = S.pieces.length ? S.sel + 1 : 0;
    S.pieces.splice(at, 0, pc);
    S.sel = at;
    rebuild();
    renderStrip();
    renderProps();
  }

  // ---------- ride ----------
  function ride() {
    hideOverlay();
    if (S.invalid.size) return toast('Red pieces are blocked here (no-build zone, off the map, or not unlocked yet).');
    S.mode = 'ride';
    S.rider = Physics.createRider();
    S.segs = S.built.segments.concat(Track.groundSegments(S.level));
    S.endT = 0;
    S.ended = false;
    S.spray = [];
    acc = 0;
    document.body.classList.add('riding');
    $('#rideBtn').innerHTML = '■ Stop';
  }

  function toEdit() {
    hideOverlay();
    if (S.rider) {
      S.lastTrail = S.rider.trail.slice();
      S.lastEnd = { x: S.rider.x, y: S.rider.y, state: S.rider.state };
    }
    S.mode = 'edit';
    S.rider = null;
    document.body.classList.remove('riding');
    $('#rideBtn').innerHTML = '▶ Ride';
  }

  function onEnd() {
    const r = S.rider;
    const delay = r.state === 'finished' ? 900 : r.state === 'crashed' ? 1300 : 500;
    setTimeout(() => {
      if (S.rider !== r) return;
      if (r.state === 'finished') {
        const L = S.level, n = S.pieces.length, st = starsFor(L, n);
        if (L.par) {
          const prev = save.best[L.id];
          if (!prev || st > prev.stars || (st === prev.stars && r.t < prev.time)) save.best[L.id] = { stars: st, time: r.t, pieces: n };
          if (S.li + 1 >= save.unlocked) save.unlocked = S.li + 2;
          persist();
          renderLevelBar();
        }
        const more = L.par && n > L.par ? ` Beat par (${L.par}) for 3 stars.` : '';
        showOverlay(L.par ? `Portal reached! ${starStr(st)}` : 'Portal reached! 🎉',
          `Time ${r.t.toFixed(2)}s · top speed ${Math.round(r.maxSpeed * 0.16)} km/h · ${n} piece${n === 1 ? '' : 's'}.${more}`, true);
      } else if (r.state === 'crashed') {
        showOverlay('Crashed!', r.msg, false);
      } else {
        showOverlay('Stopped', r.msg, false);
      }
    }, delay);
  }

  function showOverlay(title, msg, win) {
    $('#ovTitle').textContent = title;
    $('#ovMsg').textContent = msg;
    $('#overlay').classList.toggle('win', win);
    const hasNext = win && S.li < LEVELS.length - 1;
    $('#ovNext').classList.toggle('hidden', !hasNext);
    if (hasNext) $('#ovNext').textContent = needsPro(S.li + 1) ? '👑 Unlock Pro Runs' : isFree(S.li + 1) ? 'Free Ride →' : 'Next level →';
    $('#ovRetry').className = hasNext ? 'ghost' : 'primary';
    $('#overlay').classList.remove('hidden');
  }
  function hideOverlay() { $('#overlay').classList.add('hidden'); }

  let toastT;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- paywall ----------
  let pwTarget = null;
  function showPaywall(target) {
    pwTarget = target == null ? LEVELS.findIndex((l) => l.premium) : target;
    const list = $('#pwLevels');
    list.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      if (!lv.premium) return;
      const li = document.createElement('li');
      li.innerHTML = `<span class="lvnum">${i + 1}</span>${lv.name}<small>${lv.hint}</small>`;
      list.appendChild(li);
    });
    $('#pwPrice').textContent = Store.CONFIG.priceLabel;
    const ch = Store.channel();
    $('#pwBuy').textContent = ch === 'none' ? 'Coming soon' : `Subscribe · ${Store.CONFIG.priceLabel}`;
    $('#pwBuy').disabled = ch === 'none';
    const C = Store.CONFIG;
    const links = [C.termsUrl && `<a href="${C.termsUrl}" target="_blank" rel="noopener">Terms</a>`, C.privacyUrl && `<a href="${C.privacyUrl}" target="_blank" rel="noopener">Privacy</a>`].filter(Boolean).join(' · ');
    $('#pwFine').innerHTML = (ch === 'test' ? '<b>TEST MODE</b>: no charge, unlocks instantly. ' : '') +
      `Renews every year until cancelled. Cancel anytime${ch === 'ios' ? ' in your Apple ID settings' : ''}.` + (links ? `<br>${links}` : '');
    $('#paywall').classList.remove('hidden');
  }
  function hidePaywall() { $('#paywall').classList.add('hidden'); }
  function afterPro() {
    renderLevelBar();
    toast('👑 Pro Runs unlocked. Have fun!');
    if (pwTarget != null && progressOK(pwTarget)) loadLevel(pwTarget);
    else if (pwTarget != null) toast('Pro unlocked! Finish level 5 to open the Pro Runs.');
  }
  Store.onChange(() => renderLevelBar());

  // ---------- canvas input ----------
  function toWorld(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left - view.ox) / view.scale, y: (e.clientY - rect.top - view.oy) / view.scale };
  }
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (S.mode !== 'edit') return;
    const p = toWorld(e);
    const P = S.level.portal;
    if (S.level.draggable && Math.hypot(p.x - P.x, p.y - P.y) < P.r * 1.3) {
      checkpoint();
      drag = { dx: P.x - p.x, dy: P.y - p.y };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
      return;
    }
    // pick nearest track piece
    let best = -1, bd = 30;
    for (const s of S.built.segments) {
      if (s.p < 0) continue;
      const t = Math.max(0, Math.min(s.len, (p.x - s.ax) * s.tx + (p.y - s.ay) * s.ty));
      const d = Math.hypot(p.x - (s.ax + s.tx * t), p.y - (s.ay + s.ty * t));
      if (d < bd) { bd = d; best = s.p; }
    }
    if (best >= 0) select(best);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = toWorld(e), P = S.level.portal;
    P.x = Math.round(Math.max(P.r, Math.min(WORLD.W - P.r, p.x + drag.dx)));
    P.y = Math.round(Math.max(P.r, Math.min(WORLD.H - 20, p.y + drag.dy)));
  });
  const endDrag = () => { if (drag) { drag = null; canvas.classList.remove('dragging'); persist(); } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- buttons & keys ----------
  $('#rideBtn').onclick = () => (S.mode === 'edit' ? ride() : toEdit());
  $('#ovRetry').onclick = ride;
  $('#ovEdit').onclick = toEdit;
  $('#undoBtn').onclick = undo;
  $('#ovNext').onclick = () => goTo(S.li + 1);
  $('#prevLvl').onclick = () => loadLevel(S.li - 1);
  $('#nextLvl').onclick = () => goTo(S.li + 1);
  $('#proBtn').onclick = () => showPaywall();
  $('#pwClose').onclick = hidePaywall;
  $('#paywall').addEventListener('click', (e) => { if (e.target.id === 'paywall') hidePaywall(); });
  $('#pwBuy').onclick = async () => {
    const b = $('#pwBuy');
    b.disabled = true;
    const res = await Store.purchase();
    b.disabled = false;
    if (res.message) toast(res.message);
    if (res.ok) { hidePaywall(); afterPro(); }
  };
  $('#pwRestore').onclick = async () => {
    const res = await Store.restore();
    if (res.message) toast(res.message);
    if (res.ok) { hidePaywall(); afterPro(); }
  };
  $('#lvlName').onclick = (e) => { e.stopPropagation(); $('#lvlMenu').classList.toggle('hidden'); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#lvlMenu')) $('#lvlMenu').classList.add('hidden'); });
  $('#clearBtn').onclick = () => {
    if (!confirmClear()) return;
    checkpoint();
    S.pieces = clone(S.level.start);
    S.sel = 0;
    S.lastTrail = null;
    S.lastEnd = null;
    rebuild(); renderStrip(); renderProps();
  };
  let clearArmed = 0;
  function confirmClear() {
    if (Date.now() - clearArmed < 2500) return true;
    clearArmed = Date.now();
    toast('Tap Clear again to wipe your run.');
    return false;
  }
  document.querySelectorAll('[data-add]').forEach((b) => {
    b.innerHTML = `${ICONS[b.dataset.add]}<span>+ ${Track.TYPES[b.dataset.add].label}</span>`;
    b.onclick = () => addPiece(b.dataset.add);
  });
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
    if (e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Enter') return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!$('#paywall').classList.contains('hidden')) return;
      if (!$('#overlay').classList.contains('hidden')) ($('#ovNext').classList.contains('hidden') ? ride() : goTo(S.li + 1));
      else S.mode === 'edit' ? ride() : toEdit();
    } else if (e.key === 'Escape') toEdit();
    else if (S.mode === 'edit' && (e.key === 'Delete' || e.key === 'Backspace') && S.pieces.length) act('del');
  });

  // ---------- layout & loop ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * view.dpr);
    canvas.height = Math.round(h * view.dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    view.scale = Math.min(w / WORLD.W, h / WORLD.H);
    view.ox = (w - WORLD.W * view.scale) / 2;
    view.oy = (h - WORLD.H * view.scale) / 2;
  }
  new ResizeObserver(resize).observe(stage);

  S.spray = [];
  function updateSpray(dt) {
    const r = S.rider;
    const sp = Math.hypot(r.vx, r.vy);
    if (r.state === 'riding' && r.grounded && sp > 60) {
      const c = Math.cos(r.ang), s = Math.sin(r.ang);
      const n = Math.min(4, Math.round(sp / 160));
      for (let i = 0; i < n; i++) {
        const tx = r.x - c * 38, ty = r.y - s * 38 + c * 7; // tail of the board
        S.spray.push({ x: tx, y: ty, vx: -c * sp * 0.25 + (Math.random() - 0.5) * 60, vy: -s * sp * 0.25 - 60 - Math.random() * 90,
          r: 1.5 + Math.random() * 2.5, life: 0.5 + Math.random() * 0.3, max: 0.8 });
      }
    }
    for (const p of S.spray) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    S.spray = S.spray.filter((p) => p.life > 0);
    if (S.spray.length > 300) S.spray.splice(0, S.spray.length - 300);
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    S.t += dt;
    if (S.mode === 'ride' && S.rider) {
      acc += dt;
      while (acc >= Physics.SUB) { Physics.step(S.rider, S.segs, S.level); acc -= Physics.SUB; }
      updateSpray(dt);
      if (S.rider.state !== 'riding') {
        S.endT += dt;
        if (!S.ended) { S.ended = true; onEnd(); }
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0f131b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = view.scale * view.dpr;
    ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, WORLD.W, WORLD.H); ctx.clip();
    Render.draw(ctx, S);
    ctx.restore();
    requestAnimationFrame(frame);
  }

  $('#ver').textContent = 'v' + MTB.VERSION;
  load();
  resize();
  Store.init();
  loadLevel(unlocked(save.level) ? save.level : 0);
  requestAnimationFrame(frame);

  // exposed for debugging / tests
  window.MTB.app = { S, ride, toEdit, addPiece, select, loadLevel, goTo, showPaywall, save: () => save };
})();

</script>
</body>
</html>
